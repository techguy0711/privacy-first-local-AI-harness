name: Llama 3.3 70B (Server)
version: 0.0.1
schema: v1

# The gateway verifies personal Open WebUI API keys and queues requests.
models:
  - name: Llama 3.3 70B (Server)
    provider: openai
    model: coder-server:latest
    apiBase: https://__SERVER_HOST__/v1
    apiKey: ${{ secrets.OPENWEBUI_API_KEY }}
    requestOptions:
      timeout: __EDITOR_TIMEOUT_MS__
    roles:
      - chat
    # Same as config.local.yaml: disable Continue's cloud-backed search_web and
    # arbitrary-URL fetch_url_content; web search goes through Brave MCP.
    chatOptions:
      toolOverrides:
        search_web:
          disabled: true
        fetch_url_content:
          disabled: true

  - name: Nomic Embeddings (Server)
    provider: openai
    model: nomic-embed-text
    apiBase: https://__SERVER_HOST__/v1
    apiKey: ${{ secrets.OPENWEBUI_API_KEY }}
    roles:
      - embed

  # Autocomplete remains disabled; the gateway exposes chat and embeddings only.

# Brave MCP still runs locally on the developer's own machine over stdio --
# web search is independent of which machine serves the chat model.
mcpServers:
  - name: Brave Search
    type: stdio
    command: npx
    args:
      - "-y"
      - "@brave/brave-search-mcp-server@2.1.4"
      - "--transport"
      - "stdio"
    env:
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      BRAVE_MCP_ENABLED_TOOLS: "brave_web_search brave_news_search"

# __SYSTEM_PROMPT_PATH__ is replaced with an absolute file:// URI by
# `scripts/setup.sh --editors` when this file is copied into ~/.continue/.
rules:
  - uses: __SYSTEM_PROMPT_PATH__
