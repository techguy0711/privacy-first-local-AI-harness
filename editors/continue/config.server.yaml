name: Server Assistant
version: 0.0.1
schema: v1

# Editors never talk to Ollama directly in server mode -- only to Open WebUI's
# authenticated OpenAI-compatible API, reverse-proxied over TLS. See
# docs/server.md for the proxy routes __SERVER_HOST__ substitutes for below,
# and for how to get a per-user Open WebUI API key (sk-...).
models:
  - name: Coder Server
    provider: openai
    # Open WebUI's own model registry requires the exact id incl. tag --
    # confirmed live via GET /api/models -- "coder-server" alone 400s.
    model: coder-server:latest
    apiBase: https://__SERVER_HOST__/api
    apiKey: ${{ secrets.OPENWEBUI_API_KEY }}
    roles:
      - chat

  - name: Nomic Embed (server)
    provider: openai
    model: nomic-embed-text
    apiBase: https://__SERVER_HOST__/ollama-embed
    apiKey: ${{ secrets.OPENWEBUI_API_KEY }}
    roles:
      - embed

  # Autocomplete is off by default. If enabled, use only starcoder2:3b (the
  # only allowlisted autocomplete model), pulled server-side and exposed the
  # same way as the chat model above.
  # - name: StarCoder2 Autocomplete (server)
  #   provider: openai
  #   model: starcoder2:3b:latest   # Open WebUI requires the exact tagged id
  #   apiBase: https://__SERVER_HOST__/api
  #   apiKey: ${{ secrets.OPENWEBUI_API_KEY }}
  #   roles:
  #     - autocomplete

# Brave MCP still runs locally on the developer's own machine over stdio --
# web search is independent of which machine serves the chat model.
mcpServers:
  - name: Brave Search
    type: stdio
    command: npx
    args:
      - "-y"
      - "@brave/brave-search-mcp-server@2.1.4"
      - "--transport"
      - "stdio"
    env:
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      BRAVE_MCP_ENABLED_TOOLS: "brave_web_search brave_news_search"

# __SYSTEM_PROMPT_PATH__ is replaced with an absolute file:// URI by
# `scripts/setup.sh --editors` when this file is copied into ~/.continue/.
rules:
  - uses: __SYSTEM_PROMPT_PATH__
