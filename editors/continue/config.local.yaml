name: Gemma 4 12B (Local)
version: 0.0.1
schema: v1

models:
  - name: Gemma 4 12B (Local)
    provider: openai
    model: coder-local:latest
    apiBase: __GATEWAY_BASE_URL__
    requestOptions:
      timeout: __EDITOR_TIMEOUT_MS__
    roles:
      - chat
    # Continue's built-in search_web sends queries to Continue's own cloud
    # proxy (not Brave) and fetch_url_content fetches arbitrary URLs -- both
    # break "nothing reports out". Web search goes through the Brave MCP
    # server below instead. Verified in continuedev/continue v2.0.0-vscode:
    # chatOptions.toolOverrides.<tool>.disabled removes the tool entirely.
    chatOptions:
      toolOverrides:
        search_web:
          disabled: true
        fetch_url_content:
          disabled: true

  - name: Nomic Embeddings (Local)
    provider: openai
    model: nomic-embed-text
    apiBase: __GATEWAY_BASE_URL__
    roles:
      - embed

  # Autocomplete remains disabled; the gateway exposes chat and embeddings only.

mcpServers:
  - name: Brave Search
    type: stdio
    command: npx
    args:
      - "-y"
      - "@brave/brave-search-mcp-server@2.1.4"
      - "--transport"
      - "stdio"
    env:
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      BRAVE_MCP_ENABLED_TOOLS: "brave_web_search brave_news_search"

# __SYSTEM_PROMPT_PATH__ is replaced with an absolute file:// URI by
# `scripts/setup.sh --editors` when this file is copied into ~/.continue/.
rules:
  - uses: __SYSTEM_PROMPT_PATH__
