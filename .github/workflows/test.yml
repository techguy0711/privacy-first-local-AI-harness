# Unit tests and syntax checks on each push and pull request. The tests
# simulate inference (no models, no GPU), so a standard runner is enough;
# GitHub doesn't charge public repositories for those.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      # The gateway's dependencies, at the versions Open WebUI 0.12.3
      # (OPEN_WEBUI_VERSION in scripts/runtime.sh) installs; update them with it.
      - name: Install the gateway's dependencies
        run: python -m pip install --no-cache-dir fastapi==0.136.3 starlette==1.9.0 anyio==4.15.1 httpx==0.28.1 pydantic==2.13.4
      - name: Shell syntax
        run: for f in scripts/*.sh server-test/boot.sh; do bash -n "$f"; done
      - name: Python syntax
        run: python -m compileall -q services scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
